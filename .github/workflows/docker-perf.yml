name: docker-perf

# 自维护补丁分支专用:构建镜像并推到 GHCR(ghcr.io/<owner>/beecount-cloud)。
# 不走官方 release.yml —— 那里镜像名与 Docker Hub 密钥都是上游作者的,
# fork 里跑不通。此 workflow 用仓库自带的 GITHUB_TOKEN 登录 GHCR,
# 不需要任何额外 Secrets。
#
# 触发:push 到 perf/** 分支自动构建,也可在 Actions 页手动 Run。
# 镜像 tag 固定从下方 env 读,发新版时改 PERF_VERSION 一处即可。

on:
  push:
    branches:
      - "perf/**"
  workflow_dispatch:

env:
  PERF_VERSION: "1.9.0-perf2"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/beecount-cloud

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.PERF_VERSION }}
          build-args: |
            VERSION=${{ env.PERF_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
